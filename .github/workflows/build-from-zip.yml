
name: Build Target Overlay APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project from ZIP
        run: |
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Project ZIP archive not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          if [ -f extracted/TargetOverlay/settings.gradle.kts ]; then
            PROJECT_DIR="extracted/TargetOverlay"
          elif [ -f extracted/settings.gradle.kts ]; then
            PROJECT_DIR="extracted"
          else
            echo "Could not find settings.gradle.kts"
            find extracted -maxdepth 3 -type f | head -80
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TargetOverlay-debug-APK
          path: extracted/TargetOverlay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
