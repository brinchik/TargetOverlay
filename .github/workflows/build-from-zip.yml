
name: Build Target Overlay APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project from ZIP
        run: |
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Project ZIP archive not found"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP" -d extracted

          if [ -f extracted/TargetOverlay/settings.gradle.kts ]; then
            PROJECT_DIR="extracted/TargetOverlay"
          elif [ -f extracted/settings.gradle.kts ]; then
            PROJECT_DIR="extracted"
          else
            echo "Could not find settings.gradle.kts"
            find extracted -maxdepth 3 -type f | head -80
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Align Java and Kotlin targets to 17
        run: |
          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "Cannot find app/build.gradle.kts"
            exit 1
          fi

          cat >> "$BUILD_FILE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build debug APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" output/TargetOverlay-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TargetOverlay-debug-APK
          path: output/TargetOverlay-debug.apk
          if-no-files-found: error
          retention-days: 14
